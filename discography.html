<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<meta name="description" content="Explore official songs and releases from rmLv across streaming platforms.">
<title>Discography | rmLv</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#202020 0%,#111 45%,#080808 100%);color:#fff;min-height:100vh;padding:32px 18px 48px}.container{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:34px}.brand{font-size:1.25rem;font-weight:800;letter-spacing:2px}.back{color:#fff;text-decoration:none;border:1px solid #414141;border-radius:999px;padding:10px 15px;background:#151515}.back:hover,.platform:hover{border-color:#aaa;background:#202020}.intro{text-align:center;margin:16px auto 36px}.intro h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:1px;margin-bottom:10px}.intro p{color:#bdbdbd;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.release{background:linear-gradient(145deg,#171717,#0d0d0d);border:1px solid #2a2a2a;border-radius:18px;overflow:hidden;box-shadow:0 12px 35px #0006}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#171717}.body{padding:18px}.meta{color:#aaa;font-size:.82rem;margin-bottom:9px}.title{font-size:1.35rem;margin-bottom:7px}.genre{font-size:.9rem;color:#c5c5c5;line-height:1.5;margin-bottom:16px}.platforms{display:flex;flex-wrap:wrap;gap:8px}.platform{display:inline-block;text-decoration:none;color:#fff;font-size:.82rem;padding:9px 11px;border:1px solid #383838;border-radius:9px;background:#121212;transition:.15s}.empty,.error{padding:22px;border:1px solid #333;border-radius:12px;color:#c9c9c9;text-align:center;line-height:1.6}.footer{text-align:center;color:#777;font-size:.8rem;margin-top:36px}.footer a{color:#ddd}.loading{color:#bbb;text-align:center;padding:24px}@media(max-width:480px){body{padding:22px 13px 36px}.top{margin-bottom:24px}.body{padding:15px}}
</style>
</head>
<body>
<main class="container">
  <header class="top"><div class="brand">rmLv</div><a class="back" href="index.html">← Back to Home</a></header>
  <section class="intro"><h1>Discography</h1><p>Every song has a story. Find rmLv releases and listen on your favorite platform.</p></section>
  <div id="releaseGrid" class="grid" aria-live="polite"><p class="loading">Loading releases…</p></div>
  <footer class="footer">Made with feeling by rmLv · <a href="https://www.youtube.com/@rmLv.31" target="_blank" rel="noopener noreferrer">YouTube</a></footer>
</main>
<script>
const platformNames={youtube:'YouTube',spotify:'Spotify',appleMusic:'Apple Music',youtubeMusic:'YouTube Music',bandcamp:'Bandcamp',tidal:'TIDAL',deezer:'Deezer',boomplay:'Boomplay',pinterest:'Pinterest'};
const order=['youtube','spotify','appleMusic','youtubeMusic','bandcamp','tidal','deezer','boomplay','pinterest'];
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function renderReleases(items){const grid=document.getElementById('releaseGrid');grid.replaceChildren();if(!Array.isArray(items)||!items.length){grid.innerHTML='<p class="empty">No releases have been added yet.</p>';return}items.sort((a,b)=>(b.releaseDate||'').localeCompare(a.releaseDate||''));for(const item of items){const card=document.createElement('article');card.className='release';const img=document.createElement('img');img.className='cover';img.alt=(item.title||'rmLv release')+' cover art';img.loading='lazy';img.src=safeUrl(item.cover)||'';img.onerror=()=>{img.onerror=null;if(item.youtube){const match=item.youtube.match(/(?:youtu\.be\/|v=)([\w-]{11})/);if(match)img.src='https://img.youtube.com/vi/'+match[1]+'/hqdefault.jpg'}};card.appendChild(img);const body=document.createElement('div');body.className='body';const meta=document.createElement('div');meta.className='meta';meta.textContent=[item.releaseDate,item.type].filter(Boolean).join(' · ');const title=document.createElement('h2');title.className='title';title.textContent=item.title||'Untitled release';const genre=document.createElement('p');genre.className='genre';genre.textContent=item.genre||'Official rmLv release';const links=document.createElement('div');links.className='platforms';for(const key of order){const href=safeUrl(item[key]);if(!href)continue;const a=document.createElement('a');a.className='platform';a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=platformNames[key];links.appendChild(a)}body.append(meta,title,genre,links);card.appendChild(body);grid.appendChild(card)}}
fetch('./releases.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load releases.json');return r.json()}).then(renderReleases).catch(()=>{document.getElementById('releaseGrid').innerHTML='<p class="error">The release list could not be loaded. Make sure <strong>releases.json</strong> is uploaded beside this page and is valid JSON.</p>'});
</script>
</body>
</html>
