name: Automatically publish expired rmLv releases

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expire-rmlv-countdowns
  cancel-in-progress: false

jobs:
  publish-expired:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move expired countdowns into releases.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const upcomingPath = 'upcoming.json';
          const releasesPath = 'releases.json';

          function readJson(path, fallback) {
            if (!fs.existsSync(path)) return fallback;
            const raw = fs.readFileSync(path, 'utf8').trim();
            return raw ? JSON.parse(raw) : fallback;
          }
          function asArray(value) {
            if (Array.isArray(value)) return value;
            if (value && typeof value === 'object' && value.title) return [value];
            return [];
          }

          const upcomingParsed = readJson(upcomingPath, []);
          const upcomingWasArray = Array.isArray(upcomingParsed);
          const upcoming = asArray(upcomingParsed);
          const releases = asArray(readJson(releasesPath, []));

          const now = Date.now();
          function releaseInstant(item) {
            if (!item || !/^\d{4}-\d{2}-\d{2}$/.test(String(item.releaseDate || ''))) return NaN;
            const time = /^\d{2}:\d{2}$/.test(String(item.releaseTime || ''))
              ? item.releaseTime
              : '00:00';
            // Release time is Philippine time (UTC+08:00).
            return Date.parse(`${item.releaseDate}T${time}:00+08:00`);
          }

          const expired = upcoming.filter(item => {
            const instant = releaseInstant(item);
            return Number.isFinite(instant) && instant <= now;
          });

          console.log(`Upcoming entries: ${upcoming.length}`);
          console.log(`Expired entries: ${expired.length}`);
          if (!expired.length) {
            console.log('No expired countdowns. No files changed.');
            process.exit(0);
          }

          const signature = item =>
            `${String(item.title || '').trim().toLowerCase()}|${String(item.releaseDate || '').trim()}`;
          const known = new Set(releases.map(signature));
          let added = 0;

          for (const item of expired) {
            const completeRelease = { ...item };
            delete completeRelease.id;
            delete completeRelease.subtitle;
            delete completeRelease.timezone;

            const key = signature(completeRelease);
            if (!known.has(key)) {
              releases.push(completeRelease);
              known.add(key);
              added++;
              console.log(`Added release: ${completeRelease.title || '(untitled)'}`);
            } else {
              console.log(`Already in releases.json; removing duplicate countdown: ${completeRelease.title || '(untitled)'}`);
            }
          }

          const expiredSet = new Set(expired);
          const remaining = upcoming.filter(item => !expiredSet.has(item));

          // Save releases first; only then remove the countdown entry.
          fs.writeFileSync(releasesPath, JSON.stringify(releases, null, 2) + '\n');
          fs.writeFileSync(
            upcomingPath,
            JSON.stringify(upcomingWasArray ? remaining : (remaining[0] || {}), null, 2) + '\n'
          );

          console.log(`New releases added: ${added}`);
          console.log(`Expired countdowns removed: ${expired.length}`);
          console.log(`Upcoming entries remaining: ${remaining.length}`);
          NODE

      - name: Commit updated release files
        shell: bash
        run: |
          if git diff --quiet -- upcoming.json releases.json; then
            echo "No expired release changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming.json releases.json
          git commit -m "Automatically publish expired rmLv releases"
          git push
